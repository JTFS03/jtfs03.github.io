<html><head>
	
	<!-- meta tags and title -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tiny Project 6: Weather App </title>

	<!-- external and internal CSS -->
	<link rel="stylesheet" href="styles.css" media="all">



</head>
<body>

<body>

<h1 class="city">Pullman</h1>

<div class="weather-container">

    <!-- TODAY -->
    <div class="weather-card">
        <h2 class="date">Tuesday, February 11</h2>
        <div class="temp">42°</div>
        <div class="condition">Cloudy ☁️</div>
        <div class="details">
            <p>High: 48°</p>
            <p>Low: 36°</p>
        </div>
    </div>

    <!-- WEDNESDAY -->
    <div class="weather-card">
        <h2 class="date">Wednesday, February 12</h2>
        <div class="temp">50°</div>
        <div class="condition">Sunny ☀️</div>
        <div class="details">
            <p>High: 52°</p>
            <p>Low: 38°</p>
        </div>
    </div>

    <!-- THURSDAY -->
    <div class="weather-card">
        <h2 class="date">Thursday, February 13</h2>
        <div class="temp">44°</div>
        <div class="condition">Rainy 🌧</div>
        <div class="details">
            <p>High: 46°</p>
            <p>Low: 35°</p>
        </div>
    </div>

    <!-- FRIDAY -->
    <div class="weather-card">
        <h2 class="date">Friday, February 14</h2>
        <div class="temp">30°</div>
        <div class="condition">Snowy ❄️</div>
        <div class="details">
            <p>High: 32°</p>
            <p>Low: 22°</p>
        </div>
    </div>

</div>

</body>

</body>
</html>
