<html><head>
	
	<!-- meta tags and title -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tiny Project 6: Weather App </title>

	<!-- external and internal CSS -->
	<link rel="stylesheet" href="styles.css" media="all">



</head>
<body>



<h1 class="city">Pullman</h1>

<div class="weather-container">

    <!-- Tuesday -->
    <input type="checkbox" id="day1">
    <label for="day1" class="day-label">Tuesday, February 11</label>
    <div class="weather-info">
        <div class="temp">42°</div>
        <div class="condition">Cloudy ☁️</div>
        <div class="details">
            <p>High: 48°</p>
            <p>Low: 36°</p>
        </div>
    </div>

    <!-- Wednesday -->
    <input type="checkbox" id="day2">
    <label for="day2" class="day-label">Wednesday, February 12</label>
    <div class="weather-info">
        <div class="temp">50°</div>
        <div class="condition">Sunny ☀️</div>
        <div class="details">
            <p>High: 52°</p>
            <p>Low: 38°</p>
        </div>
    </div>

    <!-- Thursday -->
    <input type="checkbox" id="day3">
    <label for="day3" class="day-label">Thursday, February 13</label>
    <div class="weather-info">
        <div class="temp">44°</div>
        <div class="condition">Rainy 🌧</div>
        <div class="details">
            <p>High: 46°</p>
            <p>Low: 35°</p>
        </div>
    </div>

    <!-- Friday -->
    <input type="checkbox" id="day4">
    <label for="day4" class="day-label">Friday, February 14</label>
    <div class="weather-info">
        <div class="temp">30°</div>
        <div class="condition">Snowy ❄️</div>
        <div class="details">
            <p>High: 32°</p>
            <p>Low: 22°</p>
        </div>
    </div>

</div>

</body>
</html>
