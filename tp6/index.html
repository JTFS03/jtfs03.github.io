<html><head>
	
	<!-- meta tags and title -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tiny Project 6: Weather App </title>

	<!-- external and internal CSS -->
	<link rel="stylesheet" href="styles.css" media="all">



</head>
<body>

<div class="weather-card">

    <h1 class="city">Pullman</h1>
    <p class="date">Todays Date!</p>

    <div class="current-weather">
        <div class="temp">42°</div>
        <div class="condition">Cloudy ☁️</div>
    </div>

    <div class="details">
        <p>High: 48°</p>
        <p>Low: 36°</p>
    </div>

    <div class="forecast">
        <div class="day">
            <p>Wed<p> <!-- assumed tmw - Im sure we'll go back and update this with java -->
            <p>☀️</p>
            <p>50°</p>
        </div>
        <div class="day">
            <p>Thu</p>
            <p>🌧</p>
            <p>44°</p>
        </div>
        <div class="day">
            <p>Fri</p>
            <p>❄️</p>
            <p>30°</p>
        </div>
    </div>

</div>



</body>
</html>
