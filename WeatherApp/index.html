<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Project 6: Weather App</title>
    <link rel="stylesheet" href="styles.css" media="all">
</head>
<body>

<h1 class="city" id="city">Pullman</h1>

<button id="changeLocation">Change Location</button>

<div class="weather-container">

    <!-- Day 1 -->
    <input type="checkbox" id="day1">
    <label for="day1" class="day-label">Today</label>
    <div class="weather-info">
        <img id="icon1">
        <div class="temp" id="temp1">--</div>
        <div class="condition" id="condition1">--</div>
        <div class="details">
            <p id="high1">High: --</p>
            <p id="low1">Low: --</p>
        </div>
    </div>

    <!-- Day 2 -->
    <input type="checkbox" id="day2">
    <label for="day2" class="day-label">Tomorrow</label>
    <div class="weather-info">
        <img id="icon2">
        <div class="temp" id="temp2">--</div>
        <div class="condition" id="condition2">--</div>
        <div class="details">
            <p id="high2">High: --</p>
            <p id="low2">Low: --</p>
        </div>
    </div>

    <!-- Day 3 -->
    <input type="checkbox" id="day3">
    <label for="day3" class="day-label">The Next Day</label>
    <div class="weather-info">
        <img id="icon3">
        <div class="temp" id="temp3">--</div>
        <div class="condition" id="condition3">--</div>
        <div class="details">
            <p id="high3">High: --</p>
            <p id="low3">Low: --</p>
        </div>
    </div>

</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3>Enter Location</h3>
        <input type="text" id="locationInput" placeholder="City or Zip">
        <button id="submitLocation">Submit</button>
    </div>
</div>

<!-- JavaScript at the bottom -->
<script src="scripts.js"></script>

</body>
</html>
