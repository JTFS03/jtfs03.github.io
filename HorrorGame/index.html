<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>What Horror Villain Are You?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Title Screen -->
  <div id="start-screen">
    <h1>What Horror Villain Are You?</h1>
    <button id="start-btn">Start Quiz</button>
  </div>

  <!-- Quiz Container -->
  <div id="quiz-container" style="display: none;">
    <h2 id="question">Question goes here</h2>

    <div id="answer-buttons">
      <!-- JS will generate buttons here -->
      <button class="answer-btn">Answer 1</button>
      <button class="answer-btn">Answer 2</button>
      <button class="answer-btn">Answer 3</button>
      <button class="answer-btn">Answer 4</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-container" style="display: none;">
    <h2 id="result-title">You are...</h2>
    <p id="result-description"></p>
    <img id="result-image" src="" alt="Villain Image" style="max-width: 300px;">
    
    <button id="restart-btn">Play Again</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
