<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Horror Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="quiz-container">

  <div id="start-screen">
    <h1>Horror Quiz</h1>
    <button id="start-btn">Start</button>
  </div>

  <div id="quiz-container-inner" style="display:none;">
    <h2 id="question"></h2>
    <div id="answer-buttons"></div>
  </div>

  <div id="result-container" style="display:none;">
    <h1 id="result-title"></h1>
    <div id="villain-info"></div>
    <button id="restart-btn">Play Again</button>
  </div>

</div>

<audio id="start-sound" src="../pics/demon.mp3"></audio>
<audio id="s1" src="../pics/scream.mp3"></audio>
<audio id="s2" src="../pics/kids.mp3"></audio>
<audio id="s3" src="../pics/musicbox.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
